<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102c21">
<meta name="description" content="IneedaGig: find live music opportunities or hire musicians and bands. Three simple choices.">
<title>IneedaGig — Find a gig. Find entertainment.</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;--bg:#10281e;--mint:#b5e59d;--gold:#f1c783;--cream:#fff9ed;--border:#769b78}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 85% 20%,#285a40 0%,transparent 55%),var(--bg);color:var(--cream)}
.wrap{width:min(1000px,calc(100% - 32px));margin-inline:auto}
header{border-bottom:1px solid #53775a}header .wrap{padding:16px 0}.logo{font-size:1.55rem;letter-spacing:-.06em;font-weight:900;color:var(--cream);text-decoration:none}.logo b{color:var(--gold)}
main{width:100%;flex:1;display:flex;align-items:center;justify-content:center;padding:30px 0 42px}
h1{font-size:clamp(1.85rem,5vw,3.5rem);line-height:1.1;text-align:center;letter-spacing:-.04em;margin:12px 0 26px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:880px;margin:auto}
.choice{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:310px;padding:18px 16px;gap:14px;background:linear-gradient(155deg,#284e37,#1b382a);border:2px solid #8eb182;border-radius:20px;color:var(--cream);text-decoration:none;text-align:center;box-shadow:0 10px 35px #05170b55}
.choice.hiring{background:linear-gradient(155deg,#58482d,#2d402c);border-color:#bca16c}
.choice img{display:block;max-width:100%;width:220px;height:220px;object-fit:contain}
.choice span{font-size:clamp(1.17rem,3vw,1.8rem);font-weight:850;line-height:1.2}
.choice:hover{border-color:var(--gold);background-color:#30583d}
.choice:focus-visible,.logo:focus-visible,footer a:focus-visible{outline:3px solid #c2ffb2;outline-offset:4px}
footer{border-top:1px solid #52745b;padding:16px 0;color:#c9d9c7;font-size:.86rem}footer .wrap{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}footer a{color:#d5efcd}
@media(max-width:650px){header .wrap{padding:12px 0}.logo{font-size:1.4rem}main{padding:14px 0 26px;align-items:flex-start}h1{font-size:clamp(1.75rem,7.5vw,2.5rem);margin:12px 0 22px}.choices{grid-template-columns:1fr;gap:14px}.choice{flex-direction:row;justify-content:flex-start;text-align:left;min-height:126px;padding:12px 16px;gap:14px;border-radius:16px}.choice img{width:104px;height:104px;flex:none}.choice span{font-size:clamp(1.16rem,5vw,1.42rem)}}
@media(max-width:360px){.choice{min-height:106px}.choice img{width:84px;height:84px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Preserve the published swamp-and-gold theme and approved category mascots. */
body{background:radial-gradient(ellipse at 5% 92%,#294d33 0%,transparent 40%),radial-gradient(ellipse at 87% 15%,#285a40 0%,transparent 53%),linear-gradient(180deg,#10261b 0%,#132f24 62%,#0b1d16 100%)}
header,footer{background:linear-gradient(90deg,#142d21,#203d2b 52%,#142d21)}
.choice{background:linear-gradient(148deg,#335e3d 0%,#244631 55%,#183326 100%);border-color:#96b77e;box-shadow:0 14px 34px #05170b70,inset 0 0 0 1px #d2cc8333}
.choice.hiring{background:linear-gradient(145deg,#5c4b30 0%,#3b4930 56%,#203828 100%);border-color:#c0a66e}
.choice img{filter:drop-shadow(0 7px 11px #071c1355)}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="./" aria-label="IneedaGig home">Ineeda<b>Gig</b></a></div></header>
<main id="book"><div class="wrap">
<h1>What are you looking for?</h1>
<nav class="choices" aria-label="Choose your path">
<a class="choice" href="https://connect.intentionalnoise.info/auth.html?role=musician#auth"><img src="https://connect.intentionalnoise.info/FROG_Official_IntentionalNoise_Info_Mascot_LOCKED.png" alt="" loading="eager" width="900" height="900"><span>I'm an artist / musician</span></a>
<a class="choice hiring" href="venues.html"><img src="https://connect.intentionalnoise.info/Ineeda_Gig_Mascot_APPROVED_2026-11-08.png" alt="" loading="eager" width="1254" height="1254"><span>I'm hiring</span></a>
<a class="choice instructor" href="https://connect.intentionalnoise.info/auth.html?role=instructor#auth"><img src="https://connect.intentionalnoise.info/Testerosa_Instructor_APPROVED_2026-11-12.webp" alt="Testerosa, the Instructor mascot" loading="eager" width="1000" height="750"><span>Instructor</span></a>
</nav>
</div></main>
<footer><div class="wrap"><a href="free-vs-paid.html">What's free?</a><a href="privacy/">Privacy</a></div></footer>
<script>
// Preserve links shared from older IneedaGig pages without placing those sections on the homepage.
(function(){
 const q=new URLSearchParams(location.search),h=location.hash;
 const booking=q.get('booking');
 if(booking&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(booking)){location.replace('musicians.html?booking='+encodeURIComponent(booking)+'#opportunities');return;}
 if(h==='#opportunities'||h==='#member-requests'||h==='#social'){location.replace('musicians.html'+location.search+h);return;}
 if(h==='#regional'){location.replace('regional-opportunities.html');return;}
 if(h==='#external-performers'){location.replace('external-performers.html');return;}
 if(h==='#whats-free'){location.replace('free-vs-paid.html');return;}
})();
</script>
</body>
</html>
